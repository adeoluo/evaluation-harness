[project]
name = "evaluation-harness"
version = "0.1.0"
description = "A from-scratch evaluation and benchmarking framework for large language models and agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Provider adapters are optional; the framework runs fully offline without them.
# install with: uv sync --extra openai  (or) --extra anthropic
openai = [
    "openai>=3.46",
]
anthropic = [
    "anthropic>=2.6",
]

[project.scripts]
evaluation-harness = "evaluation_harness.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Optional, opt-in only: the independent statistics cross-check in
# tests/test_scipy_parity.py that validates the from-scratch bootstrap CI,
# paired bootstrap, McNemar test, and Cohen's d against scipy.stats. Not
# installed by default CI, so the significance code stays reference-free.
# Run with: uv sync --group validation && uv run pytest tests/test_scipy_parity.py
validation = [
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation_harness"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["evaluation_harness"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
